name: Deploy production

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Configure SSH
        id: ssh
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY_B64: ${{ secrets.DEPLOY_SSH_KEY_B64 }}
        run: |
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_USER" ] || [ -z "$DEPLOY_SSH_KEY_B64" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Deployment secrets are not configured; skipping deployment."
            exit 0
          fi
          install -d -m 700 ~/.ssh
          if ! printf '%s' "$DEPLOY_SSH_KEY_B64" | tr -d '[:space:]' | base64 --decode > ~/.ssh/deploy_key 2>/dev/null; then
            printf '%s\n' "$DEPLOY_SSH_KEY_B64" | tr -d '\r' > ~/.ssh/deploy_key
          fi
          chmod 600 ~/.ssh/deploy_key
          if ! ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null 2>&1; then
            echo "DEPLOY_SSH_KEY_B64 is neither valid Base64 nor a valid OpenSSH private key."
            exit 1
          fi
          ssh-keyscan -p 22 -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Synchronize application
        if: steps.ssh.outputs.ready == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          rsync -az --delete-after --exclude='.git/' -e "ssh -o IdentitiesOnly=yes -i ~/.ssh/deploy_key -p 22" ./ "$DEPLOY_USER@$DEPLOY_HOST:/opt/btc-usdt-long-short-indicator/"

      - name: Rebuild containers
        if: steps.ssh.outputs.ready == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -o IdentitiesOnly=yes -i ~/.ssh/deploy_key -p 22 "$DEPLOY_USER@$DEPLOY_HOST" 'cd /opt/btc-usdt-long-short-indicator && docker compose up -d --build'

      - name: Verify production
        if: steps.ssh.outputs.ready == 'true'
        run: curl --fail --silent --show-error --retry 6 --retry-delay 5 https://renjiahang1201.xyz/api/status
