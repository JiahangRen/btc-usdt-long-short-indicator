name: Deploy production

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      mode:
        description: "运行模式：预检不会同步代码或重启容器"
        required: true
        default: preflight
        type: choice
        options:
          - preflight
          - configure-env
          - deploy
          - db-diag
          - db-fix

jobs:
  deploy:
    runs-on: ubuntu-latest
    # One concurrency group per target so a deploy to one host never cancels a
    # deploy to the other. Both matrix jobs run in parallel on a single push.
    concurrency:
      group: production-${{ matrix.target }}
      cancel-in-progress: true
    # Never abort the other target just because one fails its health check.
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: legacy
            verify_url: https://renjiahang1201.xyz/api/status
          - target: hk
            verify_url: https://jeffereyreng.site/api/status
    # Secrets can't be referenced inside matrix.include, so map them per target here.
    env:
      DEPLOY_HOST: ${{ matrix.target == 'hk' && secrets.DEPLOY_HOST_HK || secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ matrix.target == 'hk' && secrets.DEPLOY_USER_HK || secrets.DEPLOY_USER }}
      DEPLOY_KEY_B64: ${{ matrix.target == 'hk' && secrets.DEPLOY_SSH_KEY_HK_B64 || secrets.DEPLOY_SSH_KEY_B64 }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Configure SSH
        id: ssh
        env:
          DEPLOY_HOST: ${{ env.DEPLOY_HOST }}
          DEPLOY_USER: ${{ env.DEPLOY_USER }}
          DEPLOY_SSH_KEY_B64: ${{ env.DEPLOY_KEY_B64 }}
        run: |
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_USER" ] || [ -z "$DEPLOY_SSH_KEY_B64" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Deployment secrets for target '${{ matrix.target }}' are not configured; skipping."
            exit 0
          fi
          install -d -m 700 ~/.ssh
          if ! printf '%s' "$DEPLOY_SSH_KEY_B64" | tr -d '[:space:]' | base64 --decode > ~/.ssh/deploy_key 2>/dev/null; then
            printf '%s\n' "$DEPLOY_SSH_KEY_B64" | tr -d '\r' > ~/.ssh/deploy_key
          fi
          chmod 600 ~/.ssh/deploy_key
          if ! ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null 2>&1; then
            echo "DEPLOY_SSH_KEY_B64 for target '${{ matrix.target }}' is neither valid Base64 nor a valid OpenSSH private key." >&2
            exit 1
          fi
          ssh-keyscan -p 22 -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Preflight remote runtime
        if: steps.ssh.outputs.ready == 'true'
        env:
          DEPLOY_HOST: ${{ env.DEPLOY_HOST }}
          DEPLOY_USER: ${{ env.DEPLOY_USER }}
        run: |
          # This read-only check must pass before source synchronization. It is
          # also the default manual workflow mode for testing SSH credentials.
          ssh -o IdentitiesOnly=yes -i ~/.ssh/deploy_key -p 22 "$DEPLOY_USER@$DEPLOY_HOST" '
            set -Eeuo pipefail
            command -v rsync >/dev/null
            command -v docker >/dev/null
            docker info >/dev/null
            docker compose version >/dev/null
            if ! docker ps >/dev/null 2>&1; then
              echo "Deployment user cannot access Docker; add it to the docker group and reconnect." >&2
              exit 1
            fi
          '

      - name: Synchronize application
        if: steps.ssh.outputs.ready == 'true' && (github.event_name == 'push' || inputs.mode == 'deploy')
        env:
          DEPLOY_HOST: ${{ env.DEPLOY_HOST }}
          DEPLOY_USER: ${{ env.DEPLOY_USER }}
        run: |
          # Market history and training samples are a persistent server-side
          # SQLite, production secrets and the current release must never be
          # overwritten by source synchronization.
          ssh -o IdentitiesOnly=yes -i ~/.ssh/deploy_key -p 22 "$DEPLOY_USER@$DEPLOY_HOST" '
            set -Eeuo pipefail
            app=/opt/btc-usdt-long-short-indicator
            releases="$app/.releases"
            backup="$releases/rollback-$(date +%Y%m%d%H%M%S)"
            test -f "$app/.env"
            for required in POSTGRES_PASSWORD ALERT_ENCRYPTION_KEY; do
              if ! grep -qE "^${required}=.+" "$app/.env"; then
                echo "Missing required production setting: $required" >&2
                exit 1
              fi
            done
            # 语音不是硬依赖，但缺了就是「整站没声音」（Azure 直接跳过，Edge 兜底
            # 在部分机房出口不通）—— 明确提示，而不是让它在页面上静默失败。
            if ! grep -qE "^AZURE_SPEECH_KEY=.+" "$app/.env"; then
              echo "Warning: AZURE_SPEECH_KEY is unset in $app/.env — Azure Speech is skipped and the Edge fallback may also be unreachable from this host. Re-run this workflow with mode=configure-env to inject it." >&2
            fi
            # 这几个凭据同样不是硬依赖：缺了会静默降级到公开数据源（宏观日历/币价额度/
            # 新闻），页面上看不出原因。明确提示，避免以后又有人问「为什么这块是空的」。
            # 千问（Qwen）不在此列：它不参与同步，缺省即未配置，属预期状态。
            for optional_secret in FINNHUB_API_KEY EIA_API_KEY COINGECKO_API_KEY; do
              if ! grep -qE "^${optional_secret}=.+" "$app/.env"; then
                echo "Warning: $optional_secret is unset in $app/.env — that provider falls back to its public source. Re-run this workflow with mode=configure-env to inject it." >&2
              fi
            done
            # Keep snapshots below the deploy-owned app directory so Actions
            # never needs an interactive sudo password.
            mkdir -p "$releases"
            mkdir -p "$backup"
            rsync -a --delete \
              --exclude=".git/" --exclude="data/" --exclude=".env" --exclude=".env.*" \
              --exclude=".releases/" --exclude=".rollback-current" \
              --exclude="docker-compose.override.yml" \
              "$app/" "$backup/"
            ln -sfn "$backup" "$app/.rollback-current"
          '
          rsync -az --delete-after \
            --exclude='.git/' --exclude='data/' --exclude='.env' --exclude='.env.*' \
            --exclude='.releases/' --exclude='.rollback-current' \
            --exclude='docker-compose.override.yml' \
            -e "ssh -o IdentitiesOnly=yes -i ~/.ssh/deploy_key -p 22" ./ "$DEPLOY_USER@$DEPLOY_HOST:/opt/btc-usdt-long-short-indicator/"

      - name: Configure deployment secrets
        if: steps.ssh.outputs.ready == 'true' && inputs.mode == 'configure-env'
        env:
          DEPLOY_HOST: ${{ env.DEPLOY_HOST }}
          DEPLOY_USER: ${{ env.DEPLOY_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          ALERT_ENCRYPTION_KEY: ${{ secrets.ALERT_ENCRYPTION_KEY }}
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
        run: |
          if [ -z "$POSTGRES_PASSWORD" ] || [ -z "$ALERT_ENCRYPTION_KEY" ]; then
            echo "POSTGRES_PASSWORD and ALERT_ENCRYPTION_KEY repository secrets are required." >&2
            exit 1
          fi
          # One value per line travels on SSH stdin, in the exact order read below.
          # The remote command preserves all existing .env entries, rewrites only
          # the keys this run carries, and never echoes a value into the log.
          #
          # 网页「API 中心」里配的凭据写在 data/api-credentials.json，而 rsync 恒排除
          # data/ 与 .env —— 所有服务端凭据都只能由这里注入。server.mjs 的读取顺序是
          # apiCredentials（网页保存的）→ 其次才是这些环境变量，所以这里的值只是兜底：
          # 在网页里重新配过的 provider，仍以网页那份为准。
          #
          # 任何一项 Secret 留空 = 「保持服务器上已有的值」，绝不会把手工配好的行删掉。
          #
          # ⚠️ 千问（Qwen）刻意排除在同步范围之外：它是一整组配置（key + baseUrl + model），
          #    且其兜底变量是 DASHSCOPE_*。这里既不写入、也不删除任何 QWEN_/DASHSCOPE_ 行。
          printf '%s\n%s\n%s\n%s\n%s\n%s\n%s\n' \
            "$POSTGRES_PASSWORD" "$ALERT_ENCRYPTION_KEY" \
            "$AZURE_SPEECH_KEY" "$AZURE_SPEECH_REGION" \
            "$FINNHUB_API_KEY" "$EIA_API_KEY" "$COINGECKO_API_KEY" | \
            ssh -o IdentitiesOnly=yes -i ~/.ssh/deploy_key -p 22 "$DEPLOY_USER@$DEPLOY_HOST" '
              set -Eeuo pipefail
              IFS= read -r postgres_password
              IFS= read -r encryption_key
              IFS= read -r azure_speech_key
              IFS= read -r azure_speech_region
              IFS= read -r finnhub_api_key
              IFS= read -r eia_api_key
              IFS= read -r coingecko_api_key
              app=/opt/btc-usdt-long-short-indicator
              env_file="$app/.env"
              before_hash=""
              if [ -f "$env_file" ]; then
                before_hash="$(sha256sum "$env_file" | cut -c1-64)"
              fi
              tmp_file="$(mktemp "$app/.env.XXXXXX")"
              trap "rm -f \"$tmp_file\"" EXIT
              # Build the drop list from the keys this run actually carries. An unset
              # secret must leave its existing line untouched; otherwise one deploy
              # with a missing secret would wipe manually configured credentials.
              # Qwen / DASHSCOPE_* never appear here: never written, never removed.
              drop_optional=""
              if [ -n "$azure_speech_key" ]; then drop_optional="$drop_optional|AZURE_SPEECH_KEY|AZURE_SPEECH_REGION"; fi
              if [ -n "$finnhub_api_key" ]; then drop_optional="$drop_optional|FINNHUB_API_KEY"; fi
              if [ -n "$eia_api_key" ]; then drop_optional="$drop_optional|EIA_API_KEY"; fi
              if [ -n "$coingecko_api_key" ]; then drop_optional="$drop_optional|COINGECKO_API_KEY"; fi
              drop="^(POSTGRES_PASSWORD|ALERT_ENCRYPTION_KEY${drop_optional})="
              if [ -f "$env_file" ]; then
                grep -v -E "$drop" "$env_file" > "$tmp_file" || true
              fi
              printf "POSTGRES_PASSWORD=%s\nALERT_ENCRYPTION_KEY=%s\n" "$postgres_password" "$encryption_key" >> "$tmp_file"
              if [ -n "$azure_speech_key" ]; then
                [ -n "$azure_speech_region" ] || azure_speech_region=eastasia
                printf "AZURE_SPEECH_KEY=%s\nAZURE_SPEECH_REGION=%s\n" "$azure_speech_key" "$azure_speech_region" >> "$tmp_file"
                written_azure="injected(region=$azure_speech_region)"
              else
                written_azure="secret unset - existing settings kept"
              fi
              if [ -n "$finnhub_api_key" ]; then printf "FINNHUB_API_KEY=%s\n" "$finnhub_api_key" >> "$tmp_file"; written_finnhub="injected"; else written_finnhub="secret unset - existing settings kept"; fi
              if [ -n "$eia_api_key" ]; then printf "EIA_API_KEY=%s\n" "$eia_api_key" >> "$tmp_file"; written_eia="injected"; else written_eia="secret unset - existing settings kept"; fi
              if [ -n "$coingecko_api_key" ]; then printf "COINGECKO_API_KEY=%s\n" "$coingecko_api_key" >> "$tmp_file"; written_coingecko="injected"; else written_coingecko="secret unset - existing settings kept"; fi
              # 只打印状态，绝不打印值。
              echo "AZURE_SPEECH_KEY       : $written_azure"
              echo "FINNHUB_API_KEY        : $written_finnhub"
              echo "EIA_API_KEY            : $written_eia"
              echo "COINGECKO_API_KEY      : $written_coingecko"
              echo "Qwen (DASHSCOPE_*)     : excluded by design - never written, never removed"
              if grep -qE "^(QWEN_|DASHSCOPE_)" "$tmp_file"; then
                echo "note: this host still has a Qwen entry in .env; it was preserved untouched."
              fi
              chmod 600 "$tmp_file"
              mv "$tmp_file" "$env_file"
              trap - EXIT
              after_hash="$(sha256sum "$env_file" | cut -c1-64)"
              if [ "$before_hash" = "$after_hash" ]; then
                echo "Deployment environment values unchanged; running containers left as they are."
              else
                echo "Deployment environment values are configured."
                # 容器不会自己重读 .env：容器在跑就顺手按新值重建，否则这次注入
                # （尤其是语音密钥）要等到下一次部署才生效。
                if [ -n "$(cd "$app" && docker compose ps -aq app 2>/dev/null || true)" ]; then
                  (cd "$app" && docker compose up -d --no-deps app)
                  echo "app container recreated so the new settings take effect."
                else
                  echo "app container is not running yet; the next deploy will pick up the new settings."
                fi
              fi
            '

      # Postgres 密码漂移的体检 / 修复。
      #
      # 背景：POSTGRES_PASSWORD 只在数据卷「首次初始化」时写进数据库。改了服务器
      # .env 的密码之后，卷里的旧密码不会跟着变 —— 症状很隐蔽：站点照常 200，但
      # /api/alerts/health 变成 enabled:false，alert-worker 反复重启。
      # db-diag 只读，db-fix 才会执行 ALTER USER（把库里的密码对齐到 .env 当前值）。
      - name: Inspect or fix postgres password drift
        if: steps.ssh.outputs.ready == 'true' && (inputs.mode == 'db-diag' || inputs.mode == 'db-fix')
        env:
          DEPLOY_HOST: ${{ env.DEPLOY_HOST }}
          DEPLOY_USER: ${{ env.DEPLOY_USER }}
          MODE: ${{ inputs.mode }}
        run: |
          ssh -o IdentitiesOnly=yes -i ~/.ssh/deploy_key -p 22 "$DEPLOY_USER@$DEPLOY_HOST" '
            set -Eeuo pipefail
            # MODE 必须内联进来：ssh 不会继承 step 的 env，远程 shell 里读 ${MODE}
            # 会直接 unbound variable 退出（上一次就是这么把第二步整个跳过的）。
            MODE="${{ inputs.mode }}"
            app=/opt/btc-usdt-long-short-indicator
            cd "$app"
            db_pw="$(grep -E ^POSTGRES_PASSWORD= .env | head -1 | cut -d= -f2- || true)"
            echo "=== 1. 容器状态 ==="
            docker compose ps --format "table {{.Service}}\t{{.Status}}" || true
            echo
            echo "=== 2. .env 关键项体检（只打印长度与字符类别，绝不打印值）==="
            for key in POSTGRES_PASSWORD ALERT_ENCRYPTION_KEY AZURE_SPEECH_KEY FINNHUB_API_KEY EIA_API_KEY COINGECKO_API_KEY; do
              value="$(grep -E "^${key}=" .env | head -1 | cut -d= -f2- || true)"
              if [ -z "$value" ]; then
                echo "   ${key}: 缺失"
              else
                note=""
                case "$value" in *\$*) note="$note 含美元符";; esac
                case "$value" in *[[:space:]]*) note="$note 含空白";; esac
                case "$value" in *[!A-Za-z0-9_./:+-]*) note="$note 含非常规字符";; esac
                echo "   ${key}: 长度 ${#value}${note}"
              fi
            done
            echo
            echo "=== 3. 用 .env 的密码连 postgres（必须走 TCP+scram，才真的校验密码）==="
            # 不能用 -h 127.0.0.1 或本地 socket：官方镜像的 pg_hba 对这两者都是 trust，
            # 拿任何密码都会「认证成功」，是假阳性（第一轮诊断就在这里被误导过）。
            # 连服务名 postgres 走容器网络，才会真正落到 scram-sha-256 校验。
            if [ -z "$db_pw" ]; then
              echo "   .env 里没有 POSTGRES_PASSWORD，无法测试"
            elif docker compose exec -T -e PGPASSWORD="$db_pw" postgres psql -U btc_alerts -h postgres -d btc_alerts -tAc "select 1" >/dev/null 2>&1; then
              echo "   认证成功 —— 库内密码与 .env 一致"
            else
              echo "   认证失败 —— 密码漂移（.env 与库内不一致）"
            fi
            echo
            echo "=== 4. 容器内 local socket（trust）是否可用（决定能否修复）==="
            if docker compose exec -T postgres psql -U btc_alerts -d btc_alerts -tAc "select current_user" >/dev/null 2>&1; then
              echo "   可用"
            else
              echo "   不可用"
            fi
            echo
            echo "=== 5. 告警库现有表数量（确认改密码不影响数据）==="
            docker compose exec -T postgres psql -U btc_alerts -d btc_alerts -tAc "select count(*) from information_schema.tables where table_schema = current_schema()" 2>/dev/null || echo "   查询失败"
            echo
            echo "=== 6. 本机告警健康 ==="
            curl -s --noproxy "*" -m 10 http://127.0.0.1:8787/api/alerts/health || echo "   取不到"
            echo
            if [ "${MODE}" = "db-fix" ]; then
              echo "=== 7. 对齐 postgres 密码到 .env 当前值 ==="
              if [ -z "$db_pw" ]; then
                echo "   缺少 POSTGRES_PASSWORD，拒绝执行" >&2
                exit 1
              fi
              # 幂等：已经一致就什么都不做（避免对正常机器做无谓重启）。
              if docker compose exec -T -e PGPASSWORD="$db_pw" postgres psql -U btc_alerts -h postgres -d btc_alerts -tAc "select 1" >/dev/null 2>&1; then
                echo "   库内密码已与 .env 一致，跳过 ALTER 与重启"
              else
                case "$db_pw" in *\$\$*)
                  echo "   密码含连续美元符，无法用 dollar-quote 安全传递，拒绝执行" >&2
                  exit 1
                  ;;
                esac
                # 改密码走本地 socket（trust，无需旧密码即可登录）。
                printf "ALTER USER btc_alerts WITH PASSWORD \$\$%s\$\$;\n" "$db_pw" | docker compose exec -T postgres psql -U btc_alerts -d btc_alerts -q -v ON_ERROR_STOP=1 -f -
                echo "   ALTER USER 执行完毕"
                if docker compose exec -T -e PGPASSWORD="$db_pw" postgres psql -U btc_alerts -h postgres -d btc_alerts -tAc "select 1" >/dev/null 2>&1; then
                  echo "   复核：TCP 认证通过"
                else
                  echo "   复核：TCP 认证仍失败，需人工检查" >&2
                fi
                docker compose restart app alert-worker >/dev/null
                echo "   已重启 app 与 alert-worker，等待重新探测…"
                sleep 10
                echo "   重启后健康："
                curl -s --noproxy "*" -m 10 http://127.0.0.1:8787/api/alerts/health || echo "   取不到"
              fi
              echo
            fi
          '

      # 第二轮取证。第一轮已排除「库里的密码漂移」（用 .env 的密码能连上库），
      # 矛盾指向 app 容器实际拿到的 DATABASE_URL —— 它由 compose 用 .env 插值拼出，
      # 中间任何一层（行尾、引号、特殊字符）出错都会表现为「密码认证失败」。
      - name: Probe database credentials
        if: ${{ !cancelled() && steps.ssh.outputs.ready == 'true' && (inputs.mode == 'db-diag' || inputs.mode == 'db-fix') }}
        env:
          DEPLOY_HOST: ${{ env.DEPLOY_HOST }}
          DEPLOY_USER: ${{ env.DEPLOY_USER }}
        run: |
          ssh -o IdentitiesOnly=yes -i ~/.ssh/deploy_key -p 22 "$DEPLOY_USER@$DEPLOY_HOST" '
            set -Eeuo pipefail
            app=/opt/btc-usdt-long-short-indicator
            cd "$app"
            nonzero() { printf %s "$1" | tr -d "A-Za-z0-9" | fold -w1 | sort -u | tr -d "\n"; }
            echo "=== A. .env 里的 POSTGRES_PASSWORD ==="
            echo -n "   出现行数: "; grep -cE ^POSTGRES_PASSWORD= .env || true
            env_pw="$(grep -E ^POSTGRES_PASSWORD= .env | head -1 | cut -d= -f2- || true)"
            echo "   首行值长度: ${#env_pw}"
            echo "   非字母数字字符(去重): [$(nonzero "$env_pw")]"
            echo
            echo "=== B. app 容器实际拿到的 DATABASE_URL ==="
            app_url="$(docker compose exec -T app printenv DATABASE_URL 2>/dev/null || true)"
            echo "   长度: ${#app_url}"
            if [ -z "$app_url" ]; then
              echo "   容器里没有 DATABASE_URL"
            else
              echo "   脱敏: $(printf %s "$app_url" | sed -e s#://[^@]*@#://****@#)"
              app_pw="${app_url#*://btc_alerts:}"
              app_pw="${app_pw%@*}"
              echo "   URL 密码段长度: ${#app_pw}"
              echo "   非字母数字字符(去重): [$(nonzero "$app_pw")]"
              if [ "$env_pw" = "$app_pw" ]; then echo "   结论: 与 .env 完全一致"; else echo "   结论: 与 .env 不一致 <== 差异源头"; fi
            fi
            echo
            echo "=== C. app 容器解析 postgres 服务名 ==="
            docker compose exec -T app node -e "require(\"dns\").promises.lookup(\"postgres\",{all:true}).then(a=>console.log(\"   \"+JSON.stringify(a))).catch(e=>console.log(\"   ERR \"+e.message))" 2>/dev/null || echo "   查询失败"
            echo
            echo "=== D. 用 app 的 URL 实际建连 ==="
            docker compose exec -T app node -e "const pg=require(\"pg\");const p=new pg.Pool({connectionString:process.env.DATABASE_URL});p.query(\"select 1 as ok\").then(()=>{console.log(\"   连接成功\");return p.end()}).catch(e=>{console.log(\"   连接失败: \"+e.message);process.exit(0)})" 2>/dev/null || echo "   探测失败"
            echo
            echo "=== E. postgres 容器身份 ==="
            docker compose ps -q postgres | xargs -r docker inspect -f "   {{.Name}} started={{.State.StartedAt}}"
            echo
            echo "=== H. 网络归属（app 连的 postgres 是不是同一个容器）==="
            app_id="$(docker compose ps -q app)"
            app_net="$(docker inspect -f "{{range \$k,\$v := .NetworkSettings.Networks}}{{\$k}}{{end}}" "$app_id")"
            echo "   app 所在网络: $app_net"
            docker inspect -f "   app 容器 IP: {{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}" "$app_id"
            docker compose ps -q postgres | xargs -r docker inspect -f "   compose postgres IP: {{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}"
            echo "   该网络里的全部容器:"
            docker network inspect "$app_net" -f "{{range .Containers}}      {{.Name}} {{.IPv4Address}}{{println}}{{end}}" || true
            echo
            echo "=== I. 全机容器清单（是否存在第二个 postgres 或同名别名）==="
            docker ps -a --format "   {{.Names}} | {{.Image}} | {{.Status}}"
            echo
            echo "=== F. .env 前 12 行骨架（值已抹掉，行尾以 cat -A 显示，^M 即 CR）==="
            sed -E -e "s/=.*/=<value>/" .env | head -12 | cat -A
            echo
            echo "=== G. 本机告警健康 ==="
            curl -s --noproxy "*" -m 10 http://127.0.0.1:8787/api/alerts/health || echo "   取不到"
            echo
          '

      - name: Build, deploy and verify local health
        id: deploy_app
        if: steps.ssh.outputs.ready == 'true' && (github.event_name == 'push' || inputs.mode == 'deploy')
        env:
          DEPLOY_HOST: ${{ env.DEPLOY_HOST }}
          DEPLOY_USER: ${{ env.DEPLOY_USER }}
        run: |
          ssh -o IdentitiesOnly=yes -i ~/.ssh/deploy_key -p 22 "$DEPLOY_USER@$DEPLOY_HOST" 'bash /opt/btc-usdt-long-short-indicator/scripts/deploy-production.sh'

      - name: Verify production
        id: verify_production
        if: steps.deploy_app.outcome == 'success'
        continue-on-error: true
        run: curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors --max-time 15 ${{ matrix.verify_url }}

      - name: Roll back after a failed deploy or verification
        # A failed build/deploy step previously left the broken release live,
        # because this step only looked at the skipped verification outcome.
        # Roll back on either failure; the script is idempotent (it always
        # restores the same pre-deploy snapshot).
        if: always() && steps.ssh.outputs.ready == 'true' && (github.event_name == 'push' || inputs.mode == 'deploy') && (steps.deploy_app.outcome == 'failure' || steps.verify_production.outcome == 'failure')
        env:
          DEPLOY_HOST: ${{ env.DEPLOY_HOST }}
          DEPLOY_USER: ${{ env.DEPLOY_USER }}
        run: |
          ssh -o IdentitiesOnly=yes -i ~/.ssh/deploy_key -p 22 "$DEPLOY_USER@$DEPLOY_HOST" 'bash /opt/btc-usdt-long-short-indicator/scripts/rollback-production.sh'
          exit 1
