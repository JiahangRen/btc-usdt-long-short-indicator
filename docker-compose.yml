services:
  app:
    build: .
    restart: unless-stopped
    # Docker creates the host-mounted SQLite directory as root; this service
    # needs write access to that single bind-mounted data directory.
    user: "0:0"
    environment:
      HOST: 0.0.0.0
      PORT: 8787
      DATABASE_URL: postgresql://btc_alerts:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/btc_alerts
      REDIS_URL: redis://redis:6379
      ALERT_ENCRYPTION_KEY: ${ALERT_ENCRYPTION_KEY:?set ALERT_ENCRYPTION_KEY}
      ALERT_COOKIE_SECURE: "true"
    expose:
      - "8787"
    ports:
      - "127.0.0.1:8787:8787"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/alerts/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    volumes:
      - ./data:/app/data

  alert-worker:
    build: .
    command: ["node", "alert-worker.mjs"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://btc_alerts:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/btc_alerts
      REDIS_URL: redis://redis:6379
      ALERT_ENCRYPTION_KEY: ${ALERT_ENCRYPTION_KEY:?set ALERT_ENCRYPTION_KEY}
    healthcheck:
      test: ["CMD-SHELL", "ps | grep -q '[n]ode alert-worker.mjs'"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: btc_alerts
      POSTGRES_USER: btc_alerts
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U btc_alerts -d btc_alerts"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  netdata:
    image: netdata/netdata:stable
    profiles: ["monitoring"]
    restart: unless-stopped
    pid: host
    ports:
      - "127.0.0.1:19999:19999"
    cap_add:
      - SYS_PTRACE
    security_opt:
      - apparmor:unconfined
    volumes:
      - netdata_config:/etc/netdata
      - netdata_lib:/var/lib/netdata
      - netdata_cache:/var/cache/netdata
      - /etc/passwd:/host/etc/passwd:ro
      - /etc/group:/host/etc/group:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc/os-release:/host/etc/os-release:ro

volumes:
  caddy_data:
  caddy_config:
  netdata_config:
  netdata_lib:
  netdata_cache:
  postgres_data:
  redis_data:
